# Friction grip on the frisbee (MEASURE): the disc is pinched by its rim between the two finger pads.
# Pull/twist tests with a spring scale give mu and the squeeze force; the pad patch is what touches the disc.
grip:
  mu: 0.6                       # pad <-> frisbee plastic (rubber pads ~0.8-1.0, bare plastic/metal ~0.3)
  squeeze_force_n: 40.0         # per finger, closed on the disc (= gripper force limit assumed)
  pad_half_tangential_m: 0.012  # half width of the contact patch along the rim
  pad_half_radial_m: 0.010      # half depth: how far the rim sits between the pads
